  // 首次使用：写入默认数据
  localStorage.setItem('hotelCalc_agents', JSON.stringify(defaultAgents));
  return defaultAgents;
}

function saveAgents(agents) {
  localStorage.setItem('hotelCalc_agents', JSON.stringify(agents));
}

// 根据 localStorage 数据构建 rates 对象
function buildRatesObj(agents) {
  var obj = {};
  for (var i = 0; i < agents.length; i++) {
    obj[agents[i].name] = agents[i].rates;
  }
  return obj;
}

var rates = buildRatesObj(getAgents());

// 刷新 Agent 下拉菜单
function refreshAgentSelect() {
  var sel = document.getElementById("agent");
  var currentVal = sel.value;
  sel.innerHTML = "";
  var agents = getAgents();
  for (var i = 0; i < agents.length; i++) {

    opt.value = agents[i].name;

    }
    sel.value = found ? currentVal : agents[0].name;
  }
}

function openAgentManager() {

function renderMgmtList() {

function renderMgmtForm(agents, idx) {
  var isNew = (idx === -2);
  var agent = (!isNew && idx >= 0 && idx < agents.length) ? agents[idx] : { name: "", rates: {} };
  var html = '<div class="mgmt-form"><div class="row"><div class="field"><label>Agent 名称</label><input type="text" id="mgmtName" value="' + (isNew ? "" : agent.name) + '" placeholder="输入名称"></div></div>';
  html += '<div style="font-size:11px;color:#555;margin-bottom:6px;">各廳退佣比例（萬分之 N，0 = 不收）</div><div class="row" style="flex-wrap:wrap;">';
  for (var h = 0; h < hallList.length; h++) {
    var hall = hallList[h];
    var val = agent.rates ? (agent.rates[hall] || 0) : 0;
    html += '<div class="field" style="min-width:90px;flex:0 0 23%;"><label>' + hall + '</label><input type="number" class="mgmt-rate" data-hall="' + hall + '" value="' + val + '" min="0" step="1"></div>';
  }
  html += '</div>';
  html += '<div class="mgmt-form-actions">';
  html += '<button class="mgmt-save-btn" onclick="saveMgmtAgent(' + idx + ')">' + (isNew ? '新增' : '儲存') + '</button>';
  html += '<button class="mgmt-cancel-btn" onclick="cancelMgmtEdit()">取消</button>';
  html += '</div></div>';
  return html;
}

function editAgent(idx) {
  mgmtEditingIndex = idx;
  renderMgmtList();
}

function cancelMgmtEdit() {
  mgmtEditingIndex = -1;
  renderMgmtList();
}

function addNewAgent() {
  mgmtEditingIndex = -2; // 新增标志
  renderMgmtList();
  // 聚焦名称输入框
  setTimeout(function() {
    var inp = document.getElementById("mgmtName");
    if (inp) inp.focus();
  }, 100);
}

function saveMgmtAgent(idx) {
  var nameInput = document.getElementById("mgmtName");
  if (!nameInput) return;
  var name = nameInput.value.trim();
  if (!name) { alert("请输入 Agent 名称！"); return; }

  var isNew = (idx === -2);
  var agents = getAgents();

  // 检查重名（排除自身）
  for (var i = 0; i < agents.length; i++) {
    if (isNew ? true : (i === idx)) continue;
    if (agents[i].name === name) {
      alert("Agent \"" + name + "\" 已存在！");
      return;
    }
  }

  var newRates = {};
  var ratesInputs = document.querySelectorAll(".mgmt-rate");
  for (var j = 0; j < ratesInputs.length; j++) {
    var hall = ratesInputs[j].getAttribute("data-hall");
    var val = parseInt(ratesInputs[j].value) || 0;
    newRates[hall] = val;
  }

  if (isNew) {
    agents.push({ name: name, rates: newRates });
  } else {
    agents[idx].name = name;
    agents[idx].rates = newRates;
  }

  saveAgents(agents);
  rates = buildRatesObj(agents);
  refreshAgentSelect();
  mgmtEditingIndex = -1;
  renderMgmtList();
}

function deleteAgent(idx) {
  var agents = getAgents();
  if (idx < 0 || idx >= agents.length) return;
  if (agents.length <= 1) { alert("至少需要保留一个 Agent！"); return; }
  if (!confirm("确定要删除 Agent \"" + agents[idx].name + "\" 吗？")) return;

  agents.splice(idx, 1);
  saveAgents(agents);
  rates = buildRatesObj(agents);
  refreshAgentSelect();
  mgmtEditingIndex = -1;
  renderMgmtList();
}

// 判断日期類型並返回對應價格
function getPriceForNight(roomInfo, dateStr, hotelName) {
  if (!dateStr) {
    // 無日期，默認返回平日價
    return { price: roomInfo.weekday, type: "平日" };
  }

  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri, 6=Sat

  // 倫敦人：先檢查特殊日
  if (hotelName === "伦敦人" && roomInfo.special !== undefined) {
    if (isSpecialDate(dateStr)) {
      return { price: roomInfo.special, type: "特殊日" };
    }
  }

  // 新濠天地 & 倫敦人（非特殊日）：三欄價格
  if (hotelName === "新濠天地" || hotelName === "伦敦人") {
    if (day === 5) return { price: roomInfo.friday || roomInfo.weekend, type: "周五" };
    if (day === 6) return { price: roomInfo.saturday || roomInfo.weekend, type: "周六" };
    return { price: roomInfo.weekday, type: "平日" };
  }

  // 銀河/永利/上葡京：兩欄價（平日 / 週末）
  if (day === 5) {
    return { price: roomInfo.weekend, type: "周五" };
  }
  if (day === 6) {
    return { price: roomInfo.weekend, type: "周六" };
  }
  return { price: roomInfo.weekday, type: "平日" };
}

// 格式化日期
function formatDate(dateStr) {
  if (!dateStr) return "";
  var d = new Date(dateStr);
  return d.getFullYear() + "/" +
    String(d.getMonth()+1).padStart(2,'0') + "/" +
    String(d.getDate()).padStart(2,'0');
}

function getWeekDayName(dateStr) {
  if (!dateStr) return "";
  var d = new Date(dateStr);
  var names = ["日","一","二","三","四","五","六"];
  return names[d.getDay()];
}

// 更新房间信息（預覽用）
function updateRoomInfo() {}

// 計算每日價格詳情
function calculateDailyDetails(checkInDate, nights, roomInfo, hotelName) {
  var details = [];
  var totals = { weekday: 0, fri: 0, sat: 0, special: 0, nights: 0 };
  var d;

  if (checkInDate) {
    d = new Date(checkInDate + "T00:00:00");
    for (var i = 0; i < nights; i++) {
      var ds = d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,'0') + "-" +
        String(d.getDate()).padStart(2,'0');
      var result = getPriceForNight(roomInfo, ds, hotelName);

      details.push({
        date: formatDate(ds),
        weekDay: getWeekDayName(ds),
        type: result.type,
        price: result.price
      });

      if (result.type === "特殊日") totals.special++;
      else if (result.type === "周六") totals.sat++;
      else if (result.type === "周五") totals.fri++;
      else totals.weekday++;

      totals.nights++;
      d.setDate(d.getDate() + 1);
    }
  }

  return { details: details, totals: totals };
}

// 主计算函数
function calculate() {
  var agent = document.getElementById("agent").value;
  var hall = document.getElementById("hall").value;
  var amount = parseFloat(document.getElementById("amount").value) || 0;
  var carFee = parseFloat(document.getElementById("carFee").value) || 0;
  var roomFee = parseFloat(document.getElementById("roomFee").value) || 0;

  // 送房信息
  var checkInDate = document.getElementById("checkInDate").value;
  var hotel = document.getElementById("hotel").value;
  var roomType = document.getElementById("roomType").value;
  var nights = parseInt(document.getElementById("nights").value) || 1;
  var rooms = parseInt(document.getElementById("rooms").value) || 1;

  if (amount <= 0 && (!hotel || !roomType)) {
    alert("请填写转码金额或选择酒店房型！");
    return;
  }

  // ========== 基本退佣计算 ==========
  var rateAgent = (rates[agent] && rates[agent][hall]) ? rates[agent][hall] : 0;
  var rateL = rates["L"][hall];

  var amountYuan = amount;

  var commissionYuan = amountYuan * rateAgent / 10000;
  var commissionLYuan = amountYuan * rateL / 10000;

  // ========== 计算结果构建（延迟到送房判断后） ==========
  // 先计算基本退佣
  var actualPayYuan = commissionYuan - carFee - roomFee;
  var profitYuan = commissionLYuan - commissionYuan;

  console.log("【调试】Agent:", agent, "厅别:", hall);
  console.log("【调试】转码金额:", amountYuan, "元");
  console.log("【调试】退佣比例:", rateAgent, "=", (rateAgent/100).toFixed(2) + "%");
  console.log("【调试】退佣金额:", Math.round(commissionYuan), "元");

  // ========== 送房达标判断 ==========
  var showRoomResult = false;
  var rhtml = "";

  if (hotel && roomType && roomData[hotel] && roomData[hotel][roomType]) {
    showRoomResult = true;
    var rInfo = roomData[hotel][roomType];

    // 永利皇宫：週五週六用 weekendCode，平日用 code
    var requiredCodePerNight = rInfo.code;
    if (hotel === "永利皇宫" && rInfo.weekendCode !== undefined) {
      // 根據入住日期判斷每晚用哪個code
      var dTemp = new Date(checkInDate + "T00:00:00");
      requiredTotalCode = 0;
      for (var ci = 0; ci < nights; ci++) {
        var dayTemp = dTemp.getDay();
        if (dayTemp === 5 || dayTemp === 6) {
          requiredTotalCode += rInfo.weekendCode;
        } else {
          requiredTotalCode += rInfo.code;
        }
        dTemp.setDate(dTemp.getDate() + 1);
      }
      requiredTotalCode *= rooms;
      // 取平均值作為每晚code（用於後續覆蓋計算）
      requiredCodePerNight = Math.round(requiredTotalCode / (nights * rooms));
    } else {
      var requiredTotalCode = requiredCodePerNight * nights * rooms;
    }

    // 使用逐日計算方式計算總房價
    var dailyResult = calculateDailyDetails(checkInDate, nights, rInfo, hotel);
    var totalRoomCost = 0;

    if (dailyResult.details.length > 0) {
      for (var di = 0; di < dailyResult.details.length; di++) {
        totalRoomCost += dailyResult.details[di].price;
      }
      totalRoomCost *= rooms;
    } else {
      // 無日期，按全平時計算
      totalRoomCost = rInfo.weekday * nights * rooms;
    }

    var dateLabel = checkInDate ? formatDate(checkInDate) : "—";
    var weekLabel = checkInDate ? getWeekDayName(checkInDate) : "";
    rhtml += "<tr><td>入住日期</td><td>" + dateLabel + " (周" + weekLabel + ") · " + nights + "晚 × " + rooms + "间</td></tr>";

    rhtml += "<tr><td>酒店</td><td>" + hotel + "</td></tr>";
    rhtml += "<tr><td>房型</td><td>" + roomType + "</td></tr>";

    // 所需轉碼（code × 10000 = 元）
    var requiredTotalCodeYuan = requiredTotalCode * 10000;
    rhtml += "<tr><td>所需转码</td><td>" + requiredTotalCodeYuan.toLocaleString() + " 元</td></tr>";

    // 房價拆解
    var costDetail = "";
    var t = dailyResult.totals;
    if (dailyResult.details.length > 0) {
      var parts = [];
      if (t.weekday > 0) parts.push(t.weekday + "晚平日×" + rInfo.weekday);
      if (t.fri > 0) parts.push(t.fri + "晚周五×" + (rInfo.friday||rInfo.weekend));
      if (t.sat > 0) parts.push(t.sat + "晚周六×" + (rInfo.saturday||rInfo.weekend));
      if (t.special > 0) parts.push(t.special + "晚特殊×" + rInfo.special);
      costDetail = parts.join(" + ");
      if (rooms > 1) costDetail += " ×" + rooms;
    } else {
      costDetail = nights + " 晚×" + rInfo.weekday;
      if (rooms > 1) costDetail += " ×" + rooms;
    }
    rhtml += "<tr><td>总房价</td><td>" + totalRoomCost.toLocaleString() + " 元</td></tr>";
    rhtml += "<tr><td>房价明细</td><td style=\"font-size:11px;color:#666;\">" + costDetail + "</td></tr>";

    // 达标判断（amount是元，requiredTotalCodeYuan也是元）
    var reached = amount >= requiredTotalCodeYuan;
    var gap = Math.abs(amount - requiredTotalCodeYuan);
    if (reached) {
      rhtml += "<tr><td>达标？</td><td><span class=\"badge-ok\">✓ 达标 · 免费送房！</span>&nbsp;<span style=\"font-size:12px;color:#2e7d32;\">（超出 " + gap.toLocaleString() + " 元）</span></td></tr>";
    } else {
      rhtml += "<tr><td>达标？</td><td><span class=\"badge-no\">✗ 未达标 · 需收房费</span>&nbsp;<span style=\"font-size:12px;color:#d32f2f;\">（还差 " + gap.toLocaleString() + " 元）</span></td></tr>";

      // ========== 优先送周末、收平日 计算逻辑 ==========
      // 每晚所需转码量（元）
      var codePerNightYuan = requiredCodePerNight * 10000;
      // 实际转码能覆盖几晚
      var coveredNightsFloat = amount / codePerNightYuan;
      var coveredNights = Math.floor(coveredNightsFloat);

      // 将所有夜晚按价格从高到低排序：特殊日 > 周六 > 周五 > 平日
      var nightList = [];
      if (dailyResult.details.length > 0) {
        for (var ni = 0; ni < dailyResult.details.length; ni++) {
          var nd = dailyResult.details[ni];
          var priceOrder = 0; // 数字越大越贵
          if (nd.type === "特殊日") priceOrder = 40;
          else if (nd.type === "周六") priceOrder = 30;
          else if (nd.type === "周五") priceOrder = 20;
          else priceOrder = 10; // 平日
          nightList.push({ idx: ni, date: nd.date, weekDay: nd.weekDay, type: nd.type, price: nd.price, order: priceOrder });
        }
      } else {
        // 没有日期信息，全部按平日算
        for (var wi = 0; wi < nights; wi++) {
          nightList.push({ idx: wi, date: "-", weekDay: "-", type: "平日", price: rInfo.weekday, order: 10 });
        }
      }
      // 按价格降序排列（贵的排前面，优先免费）
      nightList.sort(function(a,b) { return b.order - a.order; });

      // 划分：前 coveredNights 晚 = 免费（送），后面 = 收费
      var freeNights = [];
      var paidNights = [];
      var totalPaidCost = 0;

      for (var fi = 0; fi < nightList.length; fi++) {
        if (fi < coveredNights) {
          freeNights.push(nightList[fi]);
        } else {
          paidNights.push(nightList[fi]);
          totalPaidCost += nightList[fi].price;
        }
      }
      totalPaidCost *= rooms; // 多间要乘

      // 显示分配结果
      if (freeNights.length > 0 || paidNights.length > 0) {
        rhtml += "<tr style=\"background:#fff8e1\"><td colspan=\"2\"><strong style=\"font-size:13px;color:#e65100;\">📋 送房分配（优先送周末 / 不足收平日）</strong></td></tr>";

        // 免费部分 — 用实际nightList数据
        var fCountSpecial = 0, fCountSat = 0, fCountFri = 0, fCountWeekday = 0;
        for (var fgi = 0; fgi < freeNights.length; fgi++) {
          var fn = freeNights[fgi];
          if (fn.type === "特殊日") fCountSpecial++;
          else if (fn.type === "周六") fCountSat++;
          else if (fn.type === "周五") fCountFri++;
          else fCountWeekday++;
        }
        var freeParts = [];
        if (fCountSpecial > 0) freeParts.push(fCountSpecial + "晚特殊");
        if (fCountSat > 0) freeParts.push(fCountSat + "晚周六");
        if (fCountFri > 0) freeParts.push(fCountFri + "晚周五");
        if (fCountWeekday > 0) freeParts.push(fCountWeekday + "晚平日");

        rhtml += "<tr><td>✅ 免费送</td><td>" +
          "<span style=\"color:#2e7d32;font-weight:bold\">" + freeNights.length + " 晚</span> (" + freeParts.join(" + ") + ") · 转码覆盖</td></tr>";

        // 收费部分 — 用实际nightList数据构建，确保价格准确
        var paidParts = [];
        var pCountSpecial = 0, pCountSat = 0, pCountFri = 0, pCountWeekday = 0;
        var pPriceSpecial = 0, pPriceSat = 0, pPriceFri = 0, pPriceWeekday = 0;
        for (var pgi = 0; pgi < paidNights.length; pgi++) {
          var pn = paidNights[pgi];
          if (pn.type === "特殊日") { pCountSpecial++; pPriceSpecial = pn.price; }
          else if (pn.type === "周六") { pCountSat++; pPriceSat = pn.price; }
          else if (pn.type === "周五") { pCountFri++; pPriceFri = pn.price; }
          else { pCountWeekday++; pPriceWeekday = pn.price; }
        }
        if (pCountSpecial > 0) paidParts.push(pCountSpecial + "晚特殊×" + pPriceSpecial);
        if (pCountSat > 0) paidParts.push(pCountSat + "晚周六×" + pPriceSat);
        if (pCountFri > 0) paidParts.push(pCountFri + "晚周五×" + pPriceFri);
        if (pCountWeekday > 0) paidParts.push(pCountWeekday + "晚平日×" + pPriceWeekday);

        var paidDetail = paidParts.join(" + ");
        if (rooms > 1) paidDetail += " ×" + rooms;

        rhtml += "<tr><td>❌ 需收费</td><td>" +
          "<span style=\"color:#d32f2f;font-weight:bold\">" + paidNights.length + " 晚</span> (" + paidDetail + ")" +
          "&nbsp;=<span style=\"color:#d32f2f;font-weight:bold\"> " + totalPaidCost.toLocaleString() + " 元</span></td></tr>";
      }

      // coveredNights <= 0 的情况已在上面 freeNights.length === 0 时处理，无需重复
    }

    document.getElementById("roomResultTable").innerHTML = rhtml;

    // 逐日價格詳情
    var detailDiv = document.getElementById("dateDetail");
    if (dailyResult.details.length > 0) {
      var dh = "";
      for (var idx = 0; idx < dailyResult.details.length; idx++) {
        var dd = dailyResult.details[idx];
        var cls = "d-" + dd.type.toLowerCase().replace(/[^a-z]/g, "");
        if (dd.type === "特殊日") cls = "d-special";
        dh += '<div class="d-row"><span>' + dd.date + ' 周' + dd.weekDay + '</span><span class="' + cls + '">' + dd.type + ' · ' + dd.price.toLocaleString() + ' 元</span></div>';
      }
      detailDiv.innerHTML = "<div style='font-size:11px;color:#888;margin-bottom:4px;'>📅 逐日晚价明细：</div>" + dh;
      detailDiv.style.display = "block";
    } else {
      detailDiv.style.display = "none";
    }
  }

  document.getElementById("roomResult").style.display = showRoomResult ? "block" : "none";

  // ========== 构建计算结果表格（含需收房费） ==========
  var html = "";
  html += "<tr><td>Agent</td><td>" + agent + "</td></tr>";
  html += "<tr><td>厅别</td><td>" + (hallMap[hall]||hall) + " — " + hall + "</td></tr>";
  html += "<tr><td>退佣比例</td><td>" + (rateAgent/100).toFixed(2) + "%</td></tr>";
  html += "<tr><td>转码金额</td><td>" + amountYuan.toLocaleString() + " 元</td></tr>";
  html += "<tr><td>退佣金额</td><td><strong style=\"color:#d32f2f; font-size:16px;\">" + Math.round(commissionYuan).toLocaleString() + " 元</strong></td></tr>";
  if (carFee > 0) html += "<tr class=\"highlight-row\"><td>扣：车费</td><td>- " + carFee.toLocaleString() + " 元</td></tr>";
  if (roomFee > 0) html += "<tr class=\"highlight-row\"><td>扣：房消</td><td>- " + roomFee.toLocaleString() + " 元</td></tr>";

  // 未达标时显示需收房费，并扣减实出码粮
  var roomCharge = 0;
  if (showRoomResult && !reached) {
    // 使用优先送周末后的实际收费金额
    if (typeof totalPaidCost !== 'undefined' && totalPaidCost > 0) {
      roomCharge = totalPaidCost;
    } else {
      roomCharge = totalRoomCost;
    }
    html += "<tr class=\"highlight-row\"><td>扣：需收房费</td><td style=\"color:#d32f2f\">- " + roomCharge.toLocaleString() + " 元</td></tr>";
    actualPayYuan = commissionYuan - carFee - roomFee - roomCharge;
  }

  html += "<tr class=\"total-row\"><td>实出码粮</td><td><strong>" + Math.round(actualPayYuan).toLocaleString() + " 元</strong></td></tr>";
  document.getElementById("resultTable").innerHTML = html;

  // ========== Agent 对比表（仅用于 Excel 导出，不显示在页面） ==========
  // 数据保留在 calculate() 变量中，供 exportToExcel() 使用

  document.getElementById("result").style.display = "block";
  window.scrollTo({ top: document.getElementById("result").offsetTop - 10, behavior: "smooth" });

  // ========== 自动保存本次计算到历史记录 ==========
  saveToHistory({
    time: new Date().toLocaleString('zh-CN'),
    agent: agent,
    hall: hall,
    hallName: (hallMap[hall]||hall),
    rateAgent: rateAgent,
    amount: amountYuan,
    commission: Math.round(commissionYuan),
    carFee: carFee,
    roomFee: roomFee,
    actualPay: Math.round(actualPayYuan),
    rateL: rateL,
    commissionL: Math.round(commissionLYuan),
    profit: Math.round(profitYuan),
    hotel: hotel,
    roomType: roomType,
    checkInDate: checkInDate,
    checkOutDate: checkInDate ? formatDate(addDays(checkInDate, nights)) : "",
    nights: nights,
    rooms: rooms,
    reached: reached,
    gap: gap
  });
}

// ===== 日期加减 =====
function addDays(dateStr, days) {
  var d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

// ===== 自动保存到 localStorage 历史记录 =====
function saveToHistory(record) {
  var history = JSON.parse(localStorage.getItem('hotelCalc_history') || '[]');
  history.push(record);
  localStorage.setItem('hotelCalc_history', JSON.stringify(history));
}

// ===== 导出 Excel（全部历史记录 + 自动下载） =====
function exportToExcel() {
  var history = JSON.parse(localStorage.getItem('hotelCalc_history') || '[]');
  if (history.length === 0) {
    alert("还没有任何计算记录，请先进行一次计算！");
    return;
  }

  // ---- Sheet 1: 全部记录（横排）----
  var rows1 = [
    ["Agent", "转码金额（元）", "入住日期", "退房日期", "退佣金额（元）", "实出码粮（元）", "车费（元）", "房消（元）", "L获利（元）"]
  ];
  for (var hi = 0; hi < history.length; hi++) {
    var h = history[hi];
    rows1.push([
      h.agent,
      h.amount,
      h.checkInDate || "—",
      h.checkOutDate || "—",
      h.commission,
      h.actualPay,
      h.carFee,
      h.roomFee,
      h.profit
    ]);
  }

  // 合计行
  var totalAmount = 0, totalCommission = 0, totalActualPay = 0, totalCarFee = 0, totalRoomFee = 0, totalProfit = 0;
  for (var ti = 0; ti < history.length; ti++) {
    totalAmount += history[ti].amount;
    totalCommission += history[ti].commission;
    totalActualPay += history[ti].actualPay;
    totalCarFee += history[ti].carFee;
    totalRoomFee += history[ti].roomFee;
    totalProfit += history[ti].profit;
  }
  rows1.push([""]);
  rows1.push(["合计:", totalAmount.toLocaleString(), "", "", totalCommission.toLocaleString(), totalActualPay.toLocaleString(), totalCarFee.toLocaleString(), totalRoomFee.toLocaleString(), totalProfit.toLocaleString()]);

  // ---- Sheet 2: 最新一笔详情 ----
  var last = history[history.length - 1];
  var rows2 = [
    ["=== 最新计算详情 ==="],
    [""],
    ["记录时间", last.time],
    [""],
    ["Agent", last.agent],
    ["厅别", last.hallName + " — " + last.hall],
    ["退佣比例", last.rateAgent > 0 ? (last.rateAgent/100).toFixed(2) + "%" : "—"],
    [""],
    ["转码金额（元）", last.amount],
    ["退佣金额（元）", last.commission],
    ["车费（元）", last.carFee],
    ["房消（元）", last.roomFee],
    ["实出码粮（元）", last.actualPay],
    [""],
    ["L 退佣比例", last.rateL > 0 ? (last.rateL/100).toFixed(2) + "%" : "—"],
    ["L 退佣金额（元）", last.commissionL],
    ["L 获利（元）", last.profit]
  ];

  if (last.hotel && last.roomType) {
    rows2.push([ "" ]);
    rows2.push([ "=== 送房信息 ===" ]);
    rows2.push([ "酒店", last.hotel ]);
    rows2.push([ "房型", last.roomType ]);
    rows2.push([ "入住日期", (last.checkInDate||"—") + " → " + (last.checkOutDate||"") ]);
    rows2.push([ "晚数", last.nights || "—" ]);
    rows2.push([ "间数", last.rooms || "—" ]);
    rows2.push([ "达标？", last.reached ? "✓ 达标" : "✗ 未达标（差 " + (last.gap||0).toLocaleString() + " 元）" ]);
  }

  // ---- Sheet 3: Agent 对比 ----
  var hall3 = last.hall;
  var amount3 = last.amount;
  var rateL3 = last.rateL;
  var commissionL3 = last.commissionL;

  var rows3 = [["Agent", "退佣比例", "退佣金额（元）", "L 获利（元）"]];
  var allAgents = getAgents();
  for (var ai = 0; ai < allAgents.length; ai++) {
    var ag3 = allAgents[ai].name;
    var r3 = (rates[ag3] && rates[ag3][hall3]) ? rates[ag3][hall3] : 0;
    var cY3 = amount3 * r3 / 10000;
    var pY3 = Math.round(commissionL3 - cY3);
    rows3.push([ag3, r3 > 0 ? (r3/100).toFixed(2) + "%" : "—", r3 > 0 ? Math.round(cY3) : "—", ag3 === "L" ? "—" : pY3]);
  }

  // ---- 创建工作簿 ----
  var wb = XLSX.utils.book_new();
  var ws1 = XLSX.utils.aoa_to_sheet(rows1);
  var ws2 = XLSX.utils.aoa_to_sheet(rows2);
  var ws3 = XLSX.utils.aoa_to_sheet(rows3);

  // 设置列宽
  ws1['!cols'] = [{wch:10},{wch:16},{wch:12},{wch:12},{wch:14},{wch:14},{wch:10},{wch:10},{wch:12}];
  ws2['!cols'] = [{ wch: 18 }, { wch: 35 }];
  ws3['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 18 }, { wch: 16 }];

  XLSX.utils.book_append_sheet(wb, ws1, "全部记录");
  XLSX.utils.book_append_sheet(wb, ws2, "最新详情");
  XLSX.utils.book_append_sheet(wb, ws3, "Agent对比");

  // 文件名：日期_笔数
  var ts = new Date();
  var fname = "酒店计算记录_" + ts.getFullYear() +
    String(ts.getMonth()+1).padStart(2,'0') +
    String(ts.getDate()).padStart(2,'0') +
    "_" + history.length + "笔.xlsx";

  XLSX.writeFile(wb, fname);

  // 更新按钮文字显示记录数
  document.getElementById("exportBtn").textContent =
    "📊 导出 Excel（已存 " + history.length + " 笔记录）";
}

// ===== 清除历史记录 =====
function clearHistory() {
  var history = JSON.parse(localStorage.getItem('hotelCalc_history') || '[]');
  if (history.length === 0) {
    alert("目前没有任何记录。");
    return;
  }
  if (!confirm("确定要清除全部 " + history.length + " 笔计算记录吗？\n（清除后无法恢复）")) return;
  localStorage.removeItem('hotelCalc_history');
  document.getElementById("exportBtn").textContent = "📊 导出 Excel";
  alert("已清除全部记录。");
}

// ===== 生成 PNG 截图（计算结果+送房判断） =====
function exportToPNG() {
  var resultCard = document.getElementById("result");
  if (resultCard.style.display === "none") {
    alert("请先进行计算！");
    return;
  }

  // 使用 html2canvas 截图
  if (typeof html2canvas === 'undefined') {
    // 动态加载 html2canvas
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = function() { doCapture(); };
    document.head.appendChild(script);
  } else {
    doCapture();
  }

  function doCapture() {
    // 臨時隱藏按鈕
    var btns = resultCard.querySelectorAll('.btn');
    btns.forEach(function(b) { b.style.display = 'none'; });

    html2canvas(resultCard, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      // 恢復按鈕
      btns.forEach(function(b) { b.style.display = ''; });

      var link = document.createElement('a');
      link.download = '澳門1.0_計算結果_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }
}
