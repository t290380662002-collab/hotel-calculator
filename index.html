<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店轉碼計算器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f4f8; padding: 16px; }
.calc { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #1a5276; margin-bottom: 16px; font-size: 20px; }
.fld { margin-bottom: 14px; }
.fld label { display: block; font-weight: bold; color: #333; margin-bottom: 4px; font-size: 14px; }
.fld input, .fld select { width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; }
.fld input:focus, .fld select:focus { border-color: #2980b9; outline: none; }
.row { display: flex; gap: 10px; }
.row .fld { flex: 1; }
.result { background: #eaf6ff; border: 2px solid #2980b9; border-radius: 10px; padding: 16px; margin-top: 16px; }
.result h3 { color: #1a5276; margin-bottom: 10px; font-size: 16px; }
.rw { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #d4e6f9; font-size: 15px; }
.rw:last-child { border-bottom: none; font-weight: bold; color: #c0392b; font-size: 17px; }
.tag { display: inline-block; background: #27ae60; color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 13px; margin-top: 8px; }
.tag.no { background: #e74c3c; }
.note { font-size: 12px; color: #888; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="calc">
  <h2>🏨 酒店轉碼計算器</h2>

  <div class="fld">

    <select id="agent" onchange="onAgentChange()">

      </optgroup>

      </optgroup>
    </select>
  </div>

  <div class="row">
    <div class="fld">
      <label>晚數</label>
      <input type="number" id="nights" value="1" min="1" max="14" oninput="calc()">
    </div>
    <div class="fld">
      <label>每晚房價 (MOP)</label>
      <input type="number" id="price" value="0" min="0" oninput="calc()">
    </div>
  </div>

  <div class="row">
    <div class="fld">
      <label>所需轉碼 (萬/晚)</label>
      <input type="number" id="codeNeed" value="100" min="0" oninput="calc()">
    </div>
    <div class="fld">
      <label>車費 (MOP)</label>
      <input type="number" id="carFee" value="0" min="0" oninput="calc()">
    </div>
  </div>

  <div class="row">
    <div class="fld">
      <label>房消 (MOP)</label>
      <input type="number" id="roomFee" value="0" min="0" oninput="calc()">
    </div>
    <div class="fld">
      <label>退佣比例 (‰)</label>
      <input type="number" id="rebate" value="120" min="0" max="200" oninput="calc()">
    </div>
  </div>

  <div class="result" id="result">
    <h3>📊 計算結果</h3>
      <div class="rw"><span>總轉碼需求</span><span id="r_totalCode">0 萬</span></div>
      <div class="rw"><span>房價總額</span><span id="r_totalPrice">0 MOP</span></div>
      <div class="rw"><span>車費 + 房消</span><span id="r_fee">0 MOP</span></div>
      <div class="rw"><span>實出碼糧</span><span id="r_net">0 MOP</span></div>
      <div class="rw"><span>是否達標</span><span id="r_ok">--</span></div>
  </div>

  <div class="note">選擇代理人 + 酒店後，系統自動帶入退佣比例與轉碼需求</div>
</div>

function onAgentChange() {
  // 代理人改變時，如果已選酒店則更新退佣
  const hotelSel = document.getElementById('hotel');
  if (hotelSel.value) {
    onHotelChange();
  }
}

function onHotelChange() {
  const sel = document.getElementById('hotel');
  const opt = sel.options[sel.selectedIndex];
  const code = opt.getAttribute('data-wday') || '';
  const nights = parseInt(document.getElementById('nights').value) || 1;
  if (code && code !== '0') {
    document.getElementById('codeNeed').value = code;
  }
  // 自動帶入代理人退佣
  const agent = document.getElementById('agent').value;
  const key = sel.value;
  if (REBATE[agent] && REBATE[agent][key]) {
    const rb = REBATE[agent][key];
    if (rb > 0) {
      document.getElementById('rebate').value = rb;
    }
  }
  calc();
}

function calc() {
  const nights   = parseInt(document.getElementById('nights').value) || 1;
  const price    = parseFloat(document.getElementById('price').value) || 0;
  const codeOne  = parseFloat(document.getElementById('codeNeed').value) || 0;
  const carFee  = parseFloat(document.getElementById('carFee').value) || 0;
  const roomFee = parseFloat(document.getElementById('roomFee').value) || 0;
  const rebate  = parseFloat(document.getElementById('rebate').value) || 0;

  // 核心修正：總轉碼 = 每晚轉碼 × 晚數
  const totalCode = codeOne * nights;
  const totalPrice = price * nights;
  const totalFee  = carFee + roomFee;
  // 實出碼糧 = 退佣 - 車費 - 房消（退佣 = 總轉碼 × 退佣比例‰）
  const rebateAmt = totalCode * 10000 * (rebate / 1000); // 萬轉為單位
  const net = rebateAmt - totalFee;

  document.getElementById('r_totalCode').textContent  = totalCode.toLocaleString() + ' 萬';
  document.getElementById('r_totalPrice').textContent = totalPrice.toLocaleString() + ' MOP';
  document.getElementById('r_fee').textContent        = totalFee.toLocaleString() + ' MOP';

  const netElem = document.getElementById('r_net');
  netElem.textContent = Math.round(net).toLocaleString() + ' MOP';

  const okElem = document.getElementById('r_ok');
  if (totalPrice > 0 && totalCode > 0) {
    const codePerNight = totalCode / nights;
    okElem.textContent = '✅ 每晚 ' + codePerNight.toLocaleString() + ' 萬 × ' + nights + ' 晚 = ' + totalCode.toLocaleString() + ' 萬';
    okElem.style.color = '#27ae60';
  } else {
    okElem.textContent = '請輸入資料';
    okElem.style.color = '#e74c3c';
  }
}

// 網頁載入時自動計算一次
window.addEventListener('DOMContentLoaded', calc);
