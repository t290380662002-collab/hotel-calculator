<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>酒店退佣计算器</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#f0f4f8; color:#333; padding:20px; }
.box { max-width:900px; margin:0 auto; background:#fff; border-radius:12px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
h1 { text-align:center; color:#1a3a5c; margin-bottom:20px; font-size:22px; }
.section { margin-bottom:20px; }
.label { font-size:13px; color:#555; margin-bottom:4px; font-weight:bold; }
input, select { width:100%; padding:8px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:12px; }
.row { display:flex; gap:12px; }
.col { flex:1; }
button { width:100%; padding:12px; border:none; border-radius:8px; background:linear-gradient(135deg,#4f81bd,#2f5496); color:#fff; font-size:16px; font-weight:bold; cursor:pointer; }
button:hover { opacity:0.9; }
#out { display:none; margin-top:20px; }
table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
th { background:#2f5496; color:#fff; padding:8px 12px; text-align:center; }
td { padding:8px 12px; border:1px solid #d0d7e5; text-align:center; }
tr:nth-child(even) td { background:#f2f7ff; }
.highlight { background:#fffde7 !important; font-weight:bold; }
.total { background:#e8f5e9 !important; font-weight:bold; color:#2e7d32; }
.pos { color:#2e7d32; font-weight:bold; }
.neg { color:#c62828; font-weight:bold; }
.note { font-size:12px; color:#888; margin-top:8px; }
</style>
</head>
<body>
<div class="box">
<h1>澳门酒店退佣计算器</h1>

<div class="section">
  <div class="label">选择 Agent</div>
  <select id="agent">
    <option value="L">L（自己）</option>
    <option value="陈姐">陈姐</option>
    <option value="洪大哥">洪大哥</option>
    <option value="李总">李总</option>
    <option value="大圣">大圣</option>
    <option value="Ring">Ring</option>
  </select>
</div>

<div class="section">
  <div class="label">选择厅别</div>
  <select id="hall">
    <option value="励盈1">励盈1（新濠天地）</option>
    <option value="励盈2">励盈2（新濠天地）</option>
    <option value="金门1">金门1（银河）</option>
    <option value="金门8">金门8（银河）</option>
    <option value="御匾会">御匾会（伦敦人）</option>
    <option value="永利会">永利会（永利皇宫）</option>
    <option value="上葡京老佛爷">上葡京老佛爷（上葡京）</option>
    <option value="上葡京西塔">上葡京西塔（上葡京）</option>
  </select>
</div>

<div class="section">
  <div class="row">
    <div class="col">
      <div class="label">转码金额（万）</div>
      <input type="number" id="amount" placeholder="例如：1000" step="0.1">
    </div>
    <div class="col">
      <div class="label">车费</div>
      <input type="number" id="carFee" placeholder="例如：800" step="1">
    </div>
    <div class="col">
      <div class="label">房消</div>
      <input type="number" id="roomFee" placeholder="例如：2600" step="1">
    </div>
  </div>
</div>

<button onclick="calc()">开始计算</button>

<div id="out">
  <div class="section">
    <div class="label" style="font-size:16px; color:#1a3a5c;">计算结果</div>
    <table id="t1"></table>
  </div>
  <div class="section">
    <div class="label" style="font-size:16px; color:#1a3a5c;">全部 Agent 价差对比</div>
    <table id="t2"></table>
    <div class="note">绿色 = 你赚（价差为正）；红色 = 你亏；灰色 = 没价差</div>
  </div>
</div>
</div>

<script>
var rates = {
  "L":        {"励盈1":123,"励盈2":120,"金门1":123,"金门8":118,"御匾会":120,"永利会":120,"上葡京老佛爷":125,"上葡京西塔":120},
  "陈姐":      {"励盈1":120,"励盈2":118,"金门1":0,  "金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "洪大哥":    {"励盈1":112,"励盈2":110,"金门1":0,  "金门8":112,"御匾会":110,"永利会":110,"上葡京老佛爷":115,"上葡京西塔":110},
  "李总":      {"励盈1":120,"励盈2":118,"金门1":120,"金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "大圣":      {"励盈1":120,"励盈2":118,"金门1":120,"金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "Ring":      {"励盈1":123,"励盈2":120,"金门1":122,"金门8":118,"御匾会":119,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118}
};

function calc() {
  var agent = document.getElementById("agent").value;
  var hall = document.getElementById("hall").value;
  var amount = parseFloat(document.getElementById("amount").value) || 0;
  var carFee = parseFloat(document.getElementById("carFee").value) || 0;
  var roomFee = parseFloat(document.getElementById("roomFee").value) || 0;

  if (amount <= 0) { alert("请填入转码金额！"); return; }

  var rAgent = rates[agent][hall] || 0;
  var rL = rates["L"][hall] || 0;
  var commAgent = amount * rAgent / 100;
  var commL = amount * rL / 100;
  var actual = commAgent - carFee - roomFee;
  var profit = commL - commAgent;

  var h1 = "";
  h1 += "<tr><td>Agent</td><td>" + agent + "</td></tr>";
  h1 += "<tr><td>厅别</td><td>" + hall + "</td></tr>";
  h1 += "<tr><td>退佣比例</td><td>" + rAgent + "‰（" + (rAgent/100) + "%）</td></tr>";
  h1 += "<tr><td>转码金额</td><td>" + fmt(amount) + " 万</td></tr>";
  h1 += "<tr><td>退佣金额</td><td>" + Math.round(commAgent).toLocaleString() + "</td></tr>";
  if (carFee > 0) h1 += "<tr class=\"highlight\"><td>扣：车费</td><td>- " + carFee.toLocaleString() + "</td></tr>";
  if (roomFee > 0) h1 += "<tr class=\"highlight\"><td>扣：房消</td><td>- " + roomFee.toLocaleString() + "</td></tr>";
  h1 += "<tr class=\"total\"><td>实出码粮</td><td>" + Math.round(actual).toLocaleString() + "</td></tr>";
  if (agent !== "L") {
    h1 += "<tr class=\"total\"><td>L 获利（价差）</td><td>" + Math.round(profit).toLocaleString() + "</td></tr>";
  }
  document.getElementById("t1").innerHTML = h1;

  var h2 = "<tr><th>Agent</th><th>退佣比例</th><th>退佣金额</th><th>L 获利</th></tr>";
  var agents = ["L","陈姐","洪大哥","李总","大圣","Ring"];
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    var r = rates[a][hall] || 0;
    var c = amount * r / 100;
    var p = Math.round(commL - c);
    var cls = "note";
    if (a !== "L") {
      if (p > 0) cls = "pos";
      else if (p < 0) cls = "neg";
    }
    var mark = (a === agent) ? "★ " : "";
    var commStr = (r > 0) ? Math.round(c).toLocaleString() : "—";
    var profitStr = (a === "L") ? "—" : ((p >= 0 ? "+" : "") + p.toLocaleString());
    h2 += "<tr><td>" + mark + a + "</td><td>" + (r > 0 ? r : "—") + "</td><td>" + commStr + "</td><td class=\"" + cls + "\">" + profitStr + "</td></tr>";
  }
  document.getElementById("t2").innerHTML = h2;
  document.getElementById("out").style.display = "block";
}

function fmt(n) { return n.toLocaleString(); }
</script>
</body>
</html>
