<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳门酒店退佣计算器</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#e8edf2; color:#333; }
.container { max-width:680px; margin:16px auto; padding:12px; }
h1 { text-align:center; color:#1a3a5c; margin-bottom:18px; font-size:20px; font-weight:normal; }
.card { background:#fff; border-radius:10px; padding:18px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
.card-title { font-size:14px; font-weight:bold; color:#333; margin-bottom:12px; }
.row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.field { flex:1; min-width:150px; }
label { display:block; font-size:12px; color:#555; margin-bottom:3px; }
input, select { width:100%; padding:7px 10px; border:1px solid #ccc; border-radius:5px; font-size:13px; transition:border 0.2s; background:#fafafa; }
input:focus, select:focus { border-color:#4f81bd; outline:none; background:#fff; }
input[readonly] { background:#f0f0f0; color:#333; font-weight:bold; }
.btn { display:block; width:100%; padding:11px; border:none; border-radius:7px; background:#4f7cbd; color:#fff; font-size:15px; font-weight:bold; cursor:pointer; margin-top:4px; transition:opacity 0.2s; }
.btn:hover { opacity:0.9; }
#result, #roomResult { display:none; }
.result-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
.result-table th, .result-table td { padding:8px 12px; text-align:left; border-bottom:1px solid #eee; }
.result-table th { background:#f5f8ff; color:#333; font-weight:bold; font-size:12px; width:40%; }
.result-table td { color:#333; }
.highlight-row { background:#fffde7 !important; font-weight:bold; }
.total-row { background:#e8f5e9 !important; font-weight:bold; color:#2e7d32; }
.compare-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
.compare-table th, .compare-table td { padding:6px 8px; border:1px solid #ddd; text-align:center; }
.compare-table th { background:#4f7cbd; color:#fff; font-size:12px; }
.compare-table tr:nth-child(even) td { background:#f9fbff; }
.profit-pos { color:#2e7d32; font-weight:bold; }
.profit-neg { color:#c62828; font-weight:bold; }
.profit-zero { color:#888; }
.note { font-size:11px; color:#aaa; margin-top:6px; }
.section-label { font-size:12px; color:#666; margin-bottom:6px; font-weight:normal; }
.sub-card { background:#f7f9fc; border-radius:6px; padding:12px; margin-top:8px; }
.room-result-table { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
.room-result-table th, .room-result-table td { padding:6px 10px; text-align:left; border-bottom:1px solid #e0e4ea; }
.room-result-table th { background:#4f7cbd; color:#fff; }
.room-result-table tr:nth-child(even) td { background:#f5f8fc; }
.badge-ok { display:inline-block; background:#4caf50; color:#fff; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:bold; }
.badge-no { display:inline-block;background:#ff9800;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold;}
</style>
</head>
<body>
<div class="container">
<h1>澳门酒店退佣计算器</h1>

<!-- 基本资料 -->
<div class="card">
  <div class="card-title">选择 Agent</div>
  <div class="row">
    <div class="field"><select id="agent">
      <option value="L">L（自己）</option>
      <option value="陈姐">陈姐</option>
      <option value="洪大哥">洪大哥</option>
      <option value="李总">李总</option>
      <option value="大圣">大圣</option>
      <option value="Ring">Ring</option>
    </select></div>
  </div>

  <div class="card-title" style="margin-top:14px;">选择厅别</div>
  <div class="row">
    <div class="field"><select id="hall">
      <option value="金门8">金门8（银河）</option>
      <option value="金门1">金门1（银河）</option>
      <option value="励盈1">励盈1（新濠天地）</option>
      <option value="励盈2">励盈2（新濠天地）</option>
      <option value="御匾会">御匾会（伦敦人）</option>
      <option value="永利会">永利会（永利皇宫）</option>
      <option value="上葡京老佛爷">上葡京老佛爷</option>
      <option value="上葡京西塔">上葡京西塔</option>
    </select></div>
  </div>

  <div class="row" style="margin-top:12px;">
    <div class="field"><label>转码金额（万）</label><input type="number" id="amount" placeholder="例如：1000" step="0.1"></div>
    <div class="field"><label>车费</label><input type="number" id="carFee" placeholder="例：800" step="1"></div>
    <div class="field"><label>房消</label><input type="number" id="roomFee" placeholder="例：2600" step="1"></div>
  </div>
</div>

<!-- 送房信息 -->
<div class="card">
  <div class="section-label">送房信息（选填）</div>

  <div class="card-title">入住日期</div>
  <div class="row">
    <div class="field"><input type="date" id="checkInDate" onchange="updateRoomInfo()"></div>
  </div>

  <div class="row" style="margin-top:10px;">
    <div class="field"><label>酒店</label><select id="hotel" onchange="updateRoomType()">
      <option value="">— 请选择 —</option>
      <option value="银河">银河</option>
      <option value="新濠天地">新濠天地</option>
      <option value="伦敦人">伦敦人</option>
      <option value="永利皇宫">永利皇宫</option>
      <option value="上葡京">上葡京</option>
    </select></div>
    <div class="field"><label>房型</label><select id="roomType" onchange="updateRoomInfo()"></select></div>
  </div>

  <div class="row" style="margin-top:10px;">
    <div class="field"><label>晚数</label><input type="number" id="nights" value="1" min="1" max="30" oninput="updateRoomInfo()"></div>
    <div class="field"><label>间数</label><input type="number" id="rooms" value="1" min="1" max="20" oninput="updateRoomInfo()"></div>
  </div>

  <button class="btn" onclick="calculate()">开始计算</button>
</div>

<!-- 计算结果 -->
<div class="card" id="result">
  <div class="card-title">计算结果</div>
  <table class="result-table" id="resultTable"></table>

  <!-- 送房判断结果 -->
  <div id="roomResult">
    <div class="card-title" style="margin-top:18px;">送房达标判断</div>
    <table class="room-result-table" id="roomResultTable"></table>
  </div>

  <div class="card-title" style="margin-top:18px;">全部 Agent 价差对比</div>
  <table class="compare-table" id="compareTable"></table>
  <div class="note">綠色＝你賺（價差為正）；紅色＝你虧；灰色＝沒價差</div>
</div>

</div>

<script>
// ===== 房型数据 =====
const roomData = {
  "银河": {
    "万豪大床 JW01": { code: 100, weekday: 1800, weekend: 2200 },
    "万豪双床 JW01T": { code: 100, weekday: 1800, weekend: 2200 },
    "万豪一房一厅 JW06": { code: 250, weekday: 2850, weekend: 3650 },
    "丽思一房一厅 RC01": { code: 250, weekday: 2500, weekend: 3100 }
  },
  "新濠天地": {
    "摩珀斯豪华客房 PK": { code: 80, weekday: 1588, weekend: 2807 },
    "摩珀斯行政豪华 CPK": { code: 100, weekday: 2394, weekend: 3613 },
    "颐居尊尚客房 PK": { code: 80, weekday: 1208, weekend: 2728 },
    "君悦豪华客房 DLXK": { code: 60, weekday: 1401, weekend: 2300 },
    "明星汇经典客房 CRK": { code: 50, weekday: 818, weekend: 1335 },
    "巨星汇尊尚客房 SDK": { code: 80, weekday: 1191, weekend: 1910 },
    "映星汇映钻客房 EDK": { code: 80, weekday: 1289, weekend: 2508 }
  },
  "伦敦人": {
    "名汇普通房 RK": { code: 60, weekday: 1500, weekend: 2100 },
    "名汇一房一厅 LS2": { code: 120, weekday: 2500, weekend: 3100 },
    "御园一房一厅 CM1": { code: 150, weekday: 2500, weekend: 3100 },
    "伦敦人小套 KC": { code: 60, weekday: 1500, weekend: 2100 }
  },
  "永利皇宫": {
    "大床": { code: 160, weekday: 1623, weekend: 2370 },
    "双床": { code: 180, weekday: 1910,周末: 2715 },
    "湖景大床": { code: 220, weekday: 2198, weekend: 3118 },
    "行政套房": { code: 190, weekday: 1968, weekend: 2773 }
  },
  "上葡京": {
    "老佛爷": { code: 0, weekday: 0, weekend: 0 },
    "西塔": { code: 0, weekday: 0, weekend: 0 }
  }
};

// 酒店显示名
const hotelDisplayNames = {
  "银河": "银河 — 万豪",
  "新濠天地": "新濠天地 — 摩珀斯",
  "伦敦人": "伦敦人 — 御园"
};

// ===== Agent 退佣比例 =====
const rates = {
  "L":        {"励盈1":123,"励盈2":120,"金门1":123,"金门8":118,"御匾会":120,"永利会":120,"上葡京老佛爷":125,"上葡京西塔":120},
  "陈姐":      {"励盈1":120,"励盈2":118,"金门1":0,   "金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "洪大哥":    {"励盈1":112,"励盈2":110,"金门1":0,   "金门8":112,"御匾会":110,"永利会":110,"上葡京老佛爷":115,"上葡京西塔":110},
  "李总":      {"励盈1":120,"励盈2":118,"金门1":120,"金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "大圣":      {"励盈1":120,"励盈2":118,"金门1":120,"金门8":116,"御匾会":118,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118},
  "Ring":      {"励盈1":123,"励盈2":120,"金门1":122,"金门8":118,"御匾会":119,"永利会":118,"上葡京老佛爷":123,"上葡京西塔":118}
};

const hallMap = {
  "励盈1":"新濠天地","励盈2":"新濠天地","金门1":"银河","金门8":"银河",
  "御匾会":"伦敦人","永利会":"永利皇宫","上葡京老佛爷":"上葡京","上葡京西塔":"上葡京"
};

// 更新房型下拉菜单
function updateRoomType() {
  var hotel = document.getElementById("hotel").value;
  var sel = document.getElementById("roomType");
  sel.innerHTML = "<option value=''>— 请选择 —</option>";
  if (hotel && roomData[hotel]) {
    for (var r in roomData[hotel]) {
      var opt = document.createElement("option");
      opt.value = r;
      opt.textContent = r;
      sel.appendChild(opt);
    }
  }
  updateRoomInfo();
}

// 判断是否为周末（周五、周六）
function isWeekend(dateStr) {
  if (!dateStr) return false;
  var d = new Date(dateStr);
  var day = d.getDay();
  return day === 5 || day === 6; // 5=Fri, 6=Sat
}

// 格式化日期
function formatDate(dateStr) {
  if (!dateStr) return "";
  var d = new Date(dateStr);
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,'0') + "-" +
    String(d.getDate()).padStart(2,'0');
}

function getWeekDayName(dateStr) {
  if (!dateStr) return "";
  var d = new Date(dateStr);
  var names = ["日","一","二","三","四","五","六"];
  return names[d.getDay()];
}

// 更新房间信息
function updateRoomInfo() {
  // 这里可以预览所需转码等，但主要在 calculate 时才计算
}

// 计算日期范围内的平日和周末天数
function countWeekdays(checkInDate, nights) {
  var weekdays = 0;
  var weekends = 0;
  var d = new Date(checkInDate);
  for (var i = 0; i < nights; i++) {
    var day = d.getDay();
    if (day === 5 || day === 6) weekends++;
    else weekdays++;
    d.setDate(d.getDate() + 1);
  }
  return { weekdays: weekdays, weekends: weekends };
}

// 主计算函数
function calculate() {
  var agent = document.getElementById("agent").value;
  var hall = document.getElementById("hall").value;
  var amount = parseFloat(document.getElementById("amount").value) || 0;
  var carFee = parseFloat(document.getElementById("carFee").value) || 0;
  var roomFee = parseFloat(document.getElementById("roomFee").value) || 0;

  // 送房信息
  var checkInDate = document.getElementById("checkInDate").value;
  var hotel = document.getElementById("hotel").value;
  var roomType = document.getElementById("roomType").value;
  var nights = parseInt(document.getElementById("nights").value) || 1;
  var rooms = parseInt(document.getElementById("rooms").value) || 1;

  if (amount <= 0 && (!hotel || !roomType)) {
    alert("请填写转码金额或选择酒店房型！");
    return;
  }

  // ========== 基本退佣计算 ==========
  // 用户逻辑：
  //   转码金额 amount 单位：万（如 1000 = 1000 万 = 10,000,000 元）
  //   退佣比例 rateAgent 单位：%（如 118 代表 1.18%）
  //   退佣金额（元）= amount × 10000 × (rateAgent ÷ 100) ÷ 100
  //               = amount × rateAgent
  //   显示单位：元
  var rateAgent = (rates[agent] && rates[agent][hall]) ? rates[agent][hall] : 0;
  var rateL = rates["L"][hall];
  
  // 退佣金额（元）= 转码金额(万) × 退佣比例
  var commissionYuan = amount * rateAgent;  // 1000 × 118 = 118,000 元
  var commissionLYuan = amount * rateL;
  
  // 车费、房消单位已经是"元"，无需转换
  var actualPayYuan = commissionYuan - carFee - roomFee;
  var profitYuan = commissionLYuan - commissionYuan;
  
  // ✅ 调试输出
  console.log("【调试】========== 开始计算 ==========");
  console.log("【调试】Agent:", agent, "厅别:", hall);
  console.log("【调试】转码金额 amount:", amount, "万 =", amount*10000, "元");
  console.log("【调试】退佣比例 rateAgent:", rateAgent, "%（即", (rateAgent/10000).toFixed(4), "倍）");
  console.log("【调试】计算公式：commissionYuan = amount × rateAgent =", amount, "×", rateAgent, "=", commissionYuan);
  console.log("【调试】退佣金额（元）:", commissionYuan);
  console.log("【调试】车费:", carFee, "元，房消:", roomFee, "元");
  console.log("【调试】实出码粮（元）:", actualPayYuan, "=", commissionYuan, "-", carFee, "-", roomFee);
  console.log("【调试】========== 计算结束 ==========");
  
  var html = "";
  html += "<tr><td>Agent</td><td>" + agent + "</td></tr>";
  html += "<tr><td>厅别</td><td>" + (hallMap[hall]||hall) + " — " + hall + "</td></tr>";
  html += "<tr><td>退佣比例</td><td>" + rateAgent + "% （即 " + (rateAgent/10000).toFixed(4) + " 倍）</td></tr>";
  html += "<tr><td>转码金额</td><td>" + amount.toLocaleString() + " 万（" + (amount*10000).toLocaleString() + " 元）</td></tr>";
  html += "<tr><td>退佣金额</td><td>" + Math.round(commissionYuan).toLocaleString() + " 元</td></tr>";
  if (carFee > 0) html += "<tr class=\"highlight-row\"><td>扣：车费</td><td>- " + carFee.toLocaleString() + " 元</td></tr>";
  if (roomFee > 0) html += "<tr class=\"highlight-row\"><td>扣：房消</td><td>- " + roomFee.toLocaleString() + " 元</td></tr>";
  html += "<tr class=\"total-row\"><td>实出码粮</td><td>" + Math.round(actualPayYuan).toLocaleString() + " 元</td></tr>";
  if (agent !== "L") {
    html += "<tr style=\"background:#e3f2fd\" class=\"total-row\"><td>L 获利（价差）</td><td>" + Math.round(profitYuan).toLocaleString() + " 元</td></tr>";
  }
  document.getElementById("resultTable").innerHTML = html;

  // ========== 送房达标判断 ==========
  var showRoomResult = false;
  var rhtml = "";

  if (hotel && roomType && roomData[hotel] && roomData[hotel][roomType]) {
    showRoomResult = true;
    var rInfo = roomData[hotel][roomType];

    // ✅ 修掉 bug：所需转码 = 每晚转码 × 晚数 × 间数
    var requiredCodePerNight = rInfo.code;
    var requiredTotalCode = requiredCodePerNight * nights * rooms;

    // 计算房价
    var totalRoomCost = 0;
    var costDetail = "";
    if (checkInDate) {
      var wd = countWeekdays(checkInDate, nights);
      totalRoomCost = (wd.weekdays * rInfo.weekday + wd.weekends * rInfo.weekend) * rooms;
      costDetail = wd.weekdays + " 晚×" + rInfo.weekday + " + " + wd.weekends + " 晚×" + rInfo.weekend;
      if (rooms > 1) costDetail += " ×" + rooms;
    } else {
      // 默认按平日算
      totalRoomCost = rInfo.weekday * nights * rooms;
      costDetail = nights + " 晚×" + rInfo.weekday;
      if (rooms > 1) costDetail += " ×" + rooms;
    }

    var dateLabel = checkInDate ? formatDate(checkInDate) : "—";
    var weekLabel = checkInDate ? getWeekDayName(checkInDate) : "";
    var dayTypeLabel = (checkInDate && isWeekend(checkInDate)) ? "（週末）" : "（平⽇）";

    rhtml += "<tr><td>入住日期</td><td>" + dateLabel + " " + weekLabel + dayTypeLabel + "</td></tr>";

    // 酒店房型显示名
    var displayName = hotelDisplayNames[hotel] || hotel;
    var fullRoomName = displayName + " — " + roomType;
    rhtml += "<tr><td>酒店房型</td><td>" + fullRoomName + "</td></tr>";

    rhtml += "<tr><td>晚数 × 间数</td><td>" + nights + " 晚 × " + rooms + " 间</td></tr>";

    // ✅ 所需转码（修了 bug）
    rhtml += "<tr><td>所需转码</td><td>" + requiredTotalCode + " 万</td></tr>";

    rhtml += "<tr><td>房价（每间每晚）</td><td>" + (isWeekend(checkInDate)?rInfo.weekend:rInfo.weekday).toLocaleString() + "</td></tr>";
    rhtml += "<tr><td>总房价</td><td>" + totalRoomCost.toLocaleString() + "</td></tr>";

    // 达标判断
    var reached = amount >= requiredTotalCode;
    rhtml += "<tr><td>达标？</td><td>" + (reached ?
      '<span class="badge-ok">✓ 达标 · 免费送房！</span>' :
      '<span class="badge-no">✗ 未达标 · 需收房费</span>') + "</td></tr>";

    document.getElementById("roomResultTable").innerHTML = rhtml;
  }

  document.getElementById("roomResult").style.display = showRoomResult ? "block" : "none";

  // ========== Agent 对比表 ==========
  var chtml = "<tr><th>Agent</th><th>退佣比例</th><th>退佣金额（元）</th><th>L 获利（元）</th></tr>";
  var agents = ["L","陈姐","洪大哥","李总","大圣","Ring"];
  for (var i = 0; i < agents.length; i++) {
    var ag = agents[i];
    var r = (rates[ag] && rates[ag][hall]) ? rates[ag][hall] : 0;
    // 新逻辑：退佣金额（元）= amount × rateAgent
    var cYuan = amount * r;
    var pYuan = Math.round(commissionLYuan - cYuan);
    var cls = "profit-zero";
    if (ag !== "L") {
      if (pYuan > 0) cls = "profit-pos";
      else if (pYuan < 0) cls = "profit-neg";
    }
    var marker = (ag === agent) ? "★ " : "　";
    chtml += "<tr><td>" + marker + ag + "</td><td>" + (r > 0 ? r : "—") + "%</td><td>" + (r > 0 ? Math.round(cYuan).toLocaleString() : "—") + "</td><td class=\"" + cls + "\">" + (ag === "L" ? "—" : ((pYuan >= 0 ? "+" : "") + pYuan.toLocaleString())) + "</td></tr>";
  }
  document.getElementById("compareTable").innerHTML = chtml;

  document.getElementById("result").style.display = "block";
  window.scrollTo({ top: document.getElementById("result").offsetTop - 10, behavior: "smooth" });
}

// 初始化
updateRoomType();

// 设置默认日期为今天
document.getElementById("checkInDate").valueAsDate = new Date();
</script>
</body>
</html>
